<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Light background circle -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
  
  <!-- Tailor's Shears (Scissors) Left Blade & Loop -->
  <circle cx="75" cy="148" r="14" fill="none" stroke="#1A1A1A" stroke-width="5"/>
  <path d="M 85 138 L 125 55" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Tailor's Shears Right Blade & Loop -->
  <circle cx="125" cy="148" r="14" fill="none" stroke="#1A1A1A" stroke-width="5"/>
  <path d="M 115 138 L 75 55" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center Pivot Screw -->
  <circle cx="100" cy="106" r="4" fill="#D4AF37"/>
  
  <!-- Tailor's Needle Overlay with Thread Arc forming R Shape -->
  <path d="M 68 55 L 68 125 M 68 55 C 95 55 110 68 110 82 C 110 96 95 106 68 106 M 92 106 L 118 135" 
        stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Golden Needle Eye Accent -->
  <ellipse cx="68" cy="62" rx="2" ry="4" fill="#D4AF37"/>
</svg>
