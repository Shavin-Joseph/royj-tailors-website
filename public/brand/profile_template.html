<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1024px;
      height: 1024px;
      background: #f5f3ec;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
    }
    
    /* Subtle linen paper background */
    .bg-paper {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 50%, #ffffff 0%, #f7f5ed 65%, #ece9de 100%),
        repeating-linear-gradient(45deg, rgba(37,43,37,0.015) 0px, rgba(37,43,37,0.015) 1px, transparent 1px, transparent 4px),
        repeating-linear-gradient(-45deg, rgba(37,43,37,0.015) 0px, rgba(37,43,37,0.015) 1px, transparent 1px, transparent 4px);
    }

    /* Circular Crest - Safe inside Facebook 800px circular mask */
    .crest {
      position: relative;
      z-index: 10;
      width: 820px;
      height: 820px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #252b25;
      box-shadow: 
        0 20px 60px rgba(37, 43, 37, 0.12),
        inset 0 0 50px rgba(245, 243, 236, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Inner tailor dashed stitch ring */
    .stitch-ring {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 2.5px dashed #947653;
      pointer-events: none;
    }

    .inner-hairline {
      position: absolute;
      inset: 30px;
      border-radius: 50%;
      border: 1px solid rgba(37, 43, 37, 0.15);
      pointer-events: none;
    }

    /* Unmistakable Tailor Scissors Emblem */
    .scissors-badge {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: #252b25;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 16px 36px rgba(37, 43, 37, 0.25);
      border: 3px solid #c8a774;
      position: relative;
    }
    .scissors-badge svg {
      width: 175px;
      height: 175px;
      stroke: #f8f6f0;
      fill: none;
    }

    /* Brand Name - Big, Bold, Clean */
    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 104px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #252b25;
      line-height: 0.95;
      margin-bottom: 8px;
    }

    .brand-sub {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: #947653;
      margin-bottom: 24px;
    }

    /* Minimal location pill */
    .tagline-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 28px;
      border-radius: 30px;
      background: #f7f5ed;
      border: 1.5px solid #dcded2;
      color: #4c5841;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    .tagline-pill .dot {
      width: 6px;
      height: 6px;
      background: #947653;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="bg-paper"></div>

  <div class="crest">
    <div class="stitch-ring"></div>
    <div class="inner-hairline"></div>

    <!-- Clear, Iconic Tailor Scissors Emblem -->
    <div class="scissors-badge">
      <svg viewBox="0 0 100 100" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Left ring and blade -->
        <circle cx="28" cy="72" r="14" stroke="#c8a774" stroke-width="5" />
        <path d="M38 62 L80 18" stroke="#f8f6f0" stroke-width="5.5" />
        <!-- Right ring and blade -->
        <circle cx="72" cy="72" r="14" stroke="#c8a774" stroke-width="5" />
        <path d="M62 62 L20 18" stroke="#f8f6f0" stroke-width="5.5" />
        <!-- Pivot rivet -->
        <circle cx="50" cy="49" r="6" fill="#c8a774" stroke="#252b25" stroke-width="2.5" />
      </svg>
    </div>

    <!-- Brand Typography -->
    <h1 class="brand-title">ROYJ</h1>
    <div class="brand-sub">TAILORS</div>

    <!-- Clean Location / Tagline -->
    <div class="tagline-pill">
      <span>Bespoke</span>
      <div class="dot"></div>
      <span>Wattala</span>
    </div>
  </div>
</body>
</html>
